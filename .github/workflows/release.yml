name: Release
# Builds the linux/amd64 images of a release and pushes them to GHCR (ADR-037 decision 7). Triggered by
# a version tag (v1.0.0 -> images tagged 1.0.0) or run by hand with the tag selected as the ref.
# This workflow does NOT run the tests: the tagged commit must already be on main and have passed the
# checks there (it is verified to be an ancestor of main below). Nothing is deployed from here; the
# server pulls the images with deploy/scripts/release.sh.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the ancestor check below needs main.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version and image namespace
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow on a version tag (v1.0.0), not on a branch."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>."
            exit 1
          fi
          # GHCR repository names must be lower case.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "namespace=$REGISTRY/$owner" >> "$GITHUB_OUTPUT"
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Commit $GITHUB_SHA is not on main; tag a commit that has passed the main checks."
            exit 1
          fi
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: admin-ui/package.json
      - name: Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build static files
        run: TCRM_STATIC_DIR="$RUNNER_TEMP/static" deploy/scripts/build-static.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # release.sh restarts crm-redirect only when its image ID differs from the running one, so two
      # builds of identical sources must give the same image ID. That needs: provenance and sbom off
      # (attestations differ per build), and NO per-release label in the image config. The
      # org.opencontainers.image.revision and .version labels change on every tag, so they are left
      # off crm-redirect and crm-postgres (only the fixed "source" label stays); crm-admin and
      # crm-static change on every release anyway and keep them. The registry cache keeps the layers.
      - name: Build and push crm-admin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.namespace }}/crm-admin:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.namespace }}/crm-admin:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.namespace }}/crm-admin:buildcache,mode=max
      - name: Build and push crm-redirect
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: redirect/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.namespace }}/crm-redirect:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.namespace }}/crm-redirect:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.namespace }}/crm-redirect:buildcache,mode=max
      # PostgreSQL with the pinned pgBackRest. PGDG keeps old package versions for a limited time, so
      # the image is built here once and pulled on the server, never rebuilt there.
      - name: Build and push crm-postgres
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.namespace }}/crm-postgres:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.namespace }}/crm-postgres:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.namespace }}/crm-postgres:buildcache,mode=max
      - name: Build and push crm-static
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/static
          file: deploy/static/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.namespace }}/crm-static:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
      - name: Summary
        env:
          NAMESPACE: ${{ steps.meta.outputs.namespace }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Release $VERSION"
            echo ""
            echo "Pushed (linux/amd64): \`$NAMESPACE/{crm-admin,crm-redirect,crm-postgres,crm-static}:$VERSION\`"
            echo ""
            echo "Deploy on the server: \`deploy/scripts/release.sh deploy $VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
