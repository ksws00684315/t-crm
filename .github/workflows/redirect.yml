name: Redirect
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    name: Changed paths
    # Runs on every pull request so that the jobs below report "skipped" rather than nothing when
    # their paths are untouched; branch protection treats skipped required checks as passed.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout the path filter action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: filter
        uses: ./.github/actions/path-filter
        with:
          patterns: |
            .github/actions/*
            redirect/*
            config/*
            scripts/*
            .github/workflows/redirect.yml

  verify:
    name: Redirect verify
    # Skipped for draft PRs (via "changes") and when none of the paths above changed
    needs: changes
    # Runs when the paths matched, and also when "changes" itself failed (fail safe: a broken
    # filter must not turn into a skipped, i.e. passing, required check).
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (needs.changes.result != 'success' || needs.changes.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: redirect
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK 21 and Maven cache
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: redirect/pom.xml
      - name: Verify notice preservation and regeneration
        run: |
          python3 -m unittest discover -s ../scripts -p test_generate_notices.py
          mvn -B generate-resources dependency:build-classpath -DincludeScope=runtime -Dmdep.outputFile=target/runtime-classpath.txt
          python3 ../scripts/generate-notices.py .
          git diff --exit-code -- THIRD-PARTY-NOTICES
      - name: Unit tests, architecture and build gates
        run: mvn -B verify
      - name: Docker integration tests
        run: mvn -B verify -Pdocker-it
      - name: Upload coverage and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redirect-verification
          path: |
            redirect/target/site/jacoco/
            redirect/target/surefire-reports/
            redirect/target/failsafe-reports/
          if-no-files-found: error
