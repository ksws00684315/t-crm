name: Redirect
on:
  pull_request:
    branches: [main]
    paths: ['redirect/**', 'config/**', 'scripts/**', '.github/workflows/redirect.yml']
  push:
    branches: [main]
    paths: ['redirect/**', 'config/**', 'scripts/**', '.github/workflows/redirect.yml']
permissions:
  contents: read
jobs:
  verify:
    name: Redirect verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: redirect
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK 21 and Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: redirect/pom.xml
      - name: Verify notice preservation and regeneration
        run: |
          python3 -m unittest discover -s ../scripts -p test_generate_notices.py
          mvn -B generate-resources dependency:build-classpath -DincludeScope=runtime -Dmdep.outputFile=target/runtime-classpath.txt
          python3 ../scripts/generate-notices.py .
          git diff --exit-code -- THIRD-PARTY-NOTICES
      - name: Unit tests, architecture and build gates
        run: mvn -B verify
      - name: Docker integration tests
        run: mvn -B verify -Pdocker-it
      - name: Upload coverage and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redirect-verification
          path: |
            redirect/target/site/jacoco/
            redirect/target/surefire-reports/
            redirect/target/failsafe-reports/
          if-no-files-found: error
