name: Deploy
on:
  pull_request:
    branches: [main]
    paths: ['deploy/**', 'backend/Dockerfile', 'redirect/Dockerfile', '.dockerignore', '.github/workflows/deploy.yml']
  push:
    branches: [main]
    paths: ['deploy/**', 'backend/Dockerfile', 'redirect/Dockerfile', '.dockerignore', '.github/workflows/deploy.yml']
permissions:
  contents: read
jobs:
  deploy-templates:
    name: Compose files and Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose files with .env.example
        run: |
          docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env.example config -q
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.example config -q
          docker compose -f deploy/docker-compose.preview.yml --env-file deploy/.env.example config -q
      - name: Assert healthchecks use bash (not dash CMD-SHELL)
        run: python3 deploy/scripts/check-healthchecks.py
      - name: Backup retention rule
        run: bash deploy/backup/test-retention.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build redirect image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: redirect/Dockerfile
          push: false
          cache-from: type=gha,scope=redirect
          cache-to: type=gha,scope=redirect,mode=max
