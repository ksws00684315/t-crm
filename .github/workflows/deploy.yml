name: Deploy
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    name: Changed paths
    # Runs on every pull request so that the jobs below report "skipped" rather than nothing when
    # their paths are untouched; branch protection treats skipped required checks as passed.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout the path filter action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: filter
        uses: ./.github/actions/path-filter
        with:
          patterns: |
            .github/actions/*
            deploy/*
            backend/Dockerfile
            redirect/Dockerfile
            backend/src/main/resources/application*.yml
            redirect/src/main/resources/application*.yml
            .dockerignore
            .github/workflows/deploy.yml

  deploy-templates:
    name: Compose files and Dockerfiles
    # Skipped for draft PRs (via "changes") and when none of the paths above changed
    needs: changes
    # Runs when the paths matched, and also when "changes" itself failed (fail safe: a broken
    # filter must not turn into a skipped, i.e. passing, required check).
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (needs.changes.result != 'success' || needs.changes.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose files with .env.example
        run: |
          docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env.example config -q
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.example config -q
          docker compose -f deploy/docker-compose.preview.yml --env-file deploy/.env.example config -q
      - name: Assert healthchecks use bash (not dash CMD-SHELL)
        run: python3 deploy/scripts/check-healthchecks.py
      - name: Assert required application variables are passed to each service
        run: python3 deploy/scripts/check-compose-env.py
      - name: Backup retention rule
        run: bash deploy/backup/test-retention.sh
      - name: Backup credentials refresh rules (task 106)
        run: bash deploy/backup/test-refresh-s3-credentials.sh
      - name: Ops check rules (task 96)
        run: bash deploy/scripts/test-ops-check.sh
      - name: Public certificate renewal stub test (legacy L-059)
        run: bash deploy/scripts/test-renew-public-cert.sh
      - name: Release lock test (legacy L-071)
        run: bash deploy/scripts/test-release-lock.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build redirect image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: redirect/Dockerfile
          push: false
          cache-from: type=gha,scope=redirect
          cache-to: type=gha,scope=redirect,mode=max
