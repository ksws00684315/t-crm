name: OSV Scanner

on:
  # The scan reads only dependency manifests and lockfiles, so on pull requests and pushes the
  # scan job runs only when one of them (or the scanner setup) changes; otherwise it reports
  # "skipped" (see the "changes" job). The weekly schedule catches advisories published after the
  # last dependency change.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    # Runs on every pull request so that the jobs below report "skipped" rather than nothing when
    # their paths are untouched; branch protection treats skipped required checks as passed.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout the path filter action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: filter
        uses: ./.github/actions/path-filter
        with:
          patterns: |
            .github/actions/*
            *pom.xml
            *package.json
            *pnpm-lock.yaml
            *pnpm-workspace.yaml
            *.npmrc
            osv-scanner.toml
            .github/workflows/osv-scanner.yml

  scan:
    name: Vulnerabilities and licenses
    # Skipped for draft PRs (via "changes") and when none of the paths above changed
    needs: changes
    # Runs when the paths matched, and also when "changes" itself failed (fail safe: a broken
    # filter must not turn into a skipped, i.e. passing, required check).
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (needs.changes.result != 'success' || needs.changes.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan vulnerabilities and license allowlist
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --config=./osv-scanner.toml
            --licenses=MIT,MIT-0,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,EPL-1.0,EPL-2.0,CC0-1.0,Apache-1.1,0BSD
            --format=table
            ./
      - name: Save full package inventory
        if: ${{ always() }}
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --config=./osv-scanner.toml
            --licenses=MIT,MIT-0,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,EPL-1.0,EPL-2.0,CC0-1.0,Apache-1.1,0BSD
            --all-packages
            --format=json
            --output-file=osv-results.json
            ./
      - name: Show Maven transitive dependency evidence
        if: ${{ always() && hashFiles('osv-results.json') != '' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('osv-results.json').read_text())
          for result in data.get('results', []):
              path = result['source']['path']
              packages = result.get('packages', [])
              print(f"{path}: {len(packages)} resolved packages")
              for entry in packages:
                  package = entry['package']
                  if package['name'] == 'redis.clients.authentication:redis-authx-core':
                      print(f"Transitive evidence: {path} -> {package['name']}@{package['version']}")
          PY
      - name: Upload scan results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-results
          path: osv-results.json
          if-no-files-found: error
