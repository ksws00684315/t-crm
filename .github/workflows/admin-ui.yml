name: Admin UI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    name: Changed paths
    # Runs on every pull request so that the jobs below report "skipped" rather than nothing when
    # their paths are untouched; branch protection treats skipped required checks as passed.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout the path filter action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: filter
        uses: ./.github/actions/path-filter
        with:
          patterns: |
            .github/actions/*
            admin-ui/*
            .github/workflows/admin-ui.yml
            backend/src/main/java/com/tcrm/admin/shared/ErrorCode.java

  verify:
    name: Admin UI verify
    # Skipped for draft PRs (via "changes") and when none of the paths above changed
    needs: changes
    # Runs when the paths matched, and also when "changes" itself failed (fail safe: a broken
    # filter must not turn into a skipped, i.e. passing, required check).
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (needs.changes.result != 'success' || needs.changes.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: admin-ui/package.json
      - name: Node.js LTS with pnpm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Third-party notices match the committed file
        run: pnpm notices:check
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high
