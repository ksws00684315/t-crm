version: 2
# Policy (spec 07): dependencies managed by the Spring Boot parent declare no
# <version> and are upgraded only together with Spring Boot. Major upgrades
# require an ADR and are done manually, so Dependabot ignores them.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: maven
    directory: /redirect
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      redirect-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /admin-ui
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      admin-ui-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /kol-portal
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      kol-portal-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: ["minor", "patch"]
