# PRODUCTION TEMPLATE (single 4-core / 8 GB host, design document section 10).
# Review every value before use. Images are pulled from the registry (TCRM_IMAGE_REGISTRY, version
# TCRM_VERSION; built and pushed by .github/workflows/release.yml), nothing is built on the host.
# Release, update and roll back with deploy/scripts/release.sh from the repository root:
#   deploy/scripts/release.sh deploy 1.0.0
# First deployment: create the data volumes once (docker volume create tcrm_pgdata tcrm_redisdata).
# Do not run a plain "up -d" after a release: use "up -d --no-deps <service>", otherwise Compose also
# recreates every service whose image tag differs from TCRM_VERSION (deploy/README.md, "Release and rollback").
# Only Nginx publishes ports (80/443); PostgreSQL, Redis, crm-admin and crm-redirect are reachable
# only inside the compose network. Memory limits follow the design: PostgreSQL 2G, Redis 1.5G,
# crm-admin 2G, crm-redirect 512M, the rest is left for Nginx and the operating system.
name: tcrm

x-restart: &restart
  restart: unless-stopped

# Rotate container logs (json-file keeps them until the container is removed): 5 x 50 MB per service.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"

services:
  nginx:
    <<: [*restart, *logging]
    image: nginx:1.30.5-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      TCRM_DOMAIN: ${TCRM_DOMAIN:-example.com}
      # Only substitute our own variables in the templates; nginx variables ($host, ...) stay.
      NGINX_ENVSUBST_FILTER: ^TCRM_
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # The PARENT directory is mounted, not "current": a bind mount resolves a symlink once, at mount
      # time, so mounting "current" would pin the first release. Inside the container the relative link
      # current -> releases/<version> is followed per request (release.sh switches it atomically).
      - ${TCRM_STATIC_DIR:-./www}:/usr/share/nginx/sites:ro
      - ${TCRM_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    # service_started (not healthy): the redirect service must stay reachable even when the backend
    # is down, so Nginx only needs the upstream names to exist.
    depends_on:
      crm-admin:
        condition: service_started
      crm-redirect:
        condition: service_started
    mem_limit: 256m

  crm-admin:
    <<: [*restart, *logging]
    image: ${TCRM_IMAGE_REGISTRY:?TCRM_IMAGE_REGISTRY is required (deploy/.env)}/crm-admin:${TCRM_VERSION:?TCRM_VERSION is required (deploy/.env)}
    environment:
      TCRM_ADMIN_PORT: "8080"
      TCRM_DB_HOST: postgres
      # Inside the compose network PostgreSQL always listens on 5432 (TCRM_DB_PORT is a host-side port).
      TCRM_DB_PORT: "5432"
      TCRM_DB_NAME: ${TCRM_DB_NAME:-tcrm}
      TCRM_DB_USERNAME: ${TCRM_DB_USERNAME}
      TCRM_DB_PASSWORD: ${TCRM_DB_PASSWORD}
      TCRM_REDIS_HOST: redis
      TCRM_REDIS_PORT: "6379"
      TCRM_REDIS_PASSWORD: ${TCRM_REDIS_PASSWORD}
      TCRM_BOOTSTRAP_ADMIN_USERNAME: ${TCRM_BOOTSTRAP_ADMIN_USERNAME:-}
      TCRM_BOOTSTRAP_ADMIN_PASSWORD: ${TCRM_BOOTSTRAP_ADMIN_PASSWORD:-}
      TCRM_CORS_ALLOWED_ORIGINS: ${TCRM_CORS_ALLOWED_ORIGINS:-}
      # Required: https://t.<domain>, no trailing slash; startup fails when missing or malformed.
      TCRM_LINK_BASE_URL: ${TCRM_LINK_BASE_URL}
      TCRM_UPLOAD_BASE_URL: ${TCRM_UPLOAD_BASE_URL:-}
      # Required KOL portal base (https, no trailing slash) for invitation and reset mail links.
      TCRM_KOL_PORTAL_BASE_URL: ${TCRM_KOL_PORTAL_BASE_URL}
      # Required Weidian OAuth callback base (https, no trailing slash).
      TCRM_ADMIN_BASE_URL: ${TCRM_ADMIN_BASE_URL}
      # Required default for the system configuration url.redirect-fallback (task 34); the backend
      # publishes the effective value to Redis for crm-redirect.
      TCRM_REDIRECT_FALLBACK_URL: ${TCRM_REDIRECT_FALLBACK_URL}
      # Required 32-byte Base64 AES-256-GCM key for encrypted integration credentials.
      TCRM_SECRET_KEY: ${TCRM_SECRET_KEY}
      # Shared with crm-redirect: buyer ID hashes use the same protected salt.
      TCRM_IP_HASH_SALT: ${TCRM_IP_HASH_SALT}
      # Resend API key for KOL invitation / reset mails; empty means the logging fallback.
      TCRM_MAIL_API_KEY: ${TCRM_MAIL_API_KEY:-}
      # Sender address; REQUIRED when TCRM_MAIL_API_KEY is set (startup fails otherwise).
      TCRM_MAIL_FROM: ${TCRM_MAIL_FROM:-}
      # Same value as crm-redirect: the backlog alarm compares against it.
      TCRM_CLICK_STREAM_MAXLEN: ${TCRM_CLICK_STREAM_MAXLEN:-1000000}
      # Fixed to the compose network subnet; not taken from .env (ADR-009).
      TCRM_TRUSTED_PROXIES: 172.30.0.0/24
      # Empty falls back to CF-Connecting-IP,X-Forwarded-For in ClientIpResolver.
      TCRM_CLIENT_IP_HEADERS: ${TCRM_CLIENT_IP_HEADERS:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
      # Fail startup when the database schema is newer than this image (rollback safety, #106):
      # empty (unset) means strict. Local dev and the preview share one database across branches and
      # keep the lenient default (*:future) instead. Emergency rollback: set it to '*:future' in .env
      # and recreate crm-admin (deploy/README.md, "Release and rollback"); release.sh never sets it.
      TCRM_FLYWAY_IGNORE_MIGRATION_PATTERNS: ${TCRM_FLYWAY_IGNORE_MIGRATION_PATTERNS:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # JRE image has no curl. CMD-SHELL uses /bin/sh (dash), which has no /dev/tcp;
      # invoke bash explicitly (Temurin JRE ships bash).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 2g

  crm-redirect:
    <<: [*restart, *logging]
    image: ${TCRM_IMAGE_REGISTRY:?TCRM_IMAGE_REGISTRY is required (deploy/.env)}/crm-redirect:${TCRM_VERSION:?TCRM_VERSION is required (deploy/.env)}
    environment:
      TCRM_REDIRECT_PORT: "8081"
      TCRM_REDIS_HOST: redis
      TCRM_REDIS_PORT: "6379"
      TCRM_REDIS_PASSWORD: ${TCRM_REDIS_PASSWORD}
      TCRM_REDIRECT_FALLBACK_URL: ${TCRM_REDIRECT_FALLBACK_URL}
      TCRM_IP_HASH_SALT: ${TCRM_IP_HASH_SALT}
      # Fixed to the compose network subnet; not taken from .env (ADR-009).
      TCRM_TRUSTED_PROXIES: 172.30.0.0/24
      # Empty falls back to CF-Connecting-IP,X-Forwarded-For in ClientIpResolver.
      TCRM_CLIENT_IP_HEADERS: ${TCRM_CLIENT_IP_HEADERS:-}
      # Application rejects non-positive values; default matches application.yml.
      TCRM_CLICK_STREAM_MAXLEN: ${TCRM_CLICK_STREAM_MAXLEN:-1000000}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Same as crm-admin: bash, not dash (see comment there).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200'"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  postgres:
    <<: [*restart, *logging]
    # PostgreSQL 17.11 plus a pinned pgBackRest (ADR-037 decision 5), built once by the release
    # workflow from deploy/postgres/Dockerfile and pulled here. release.sh never restarts the database.
    image: ${TCRM_IMAGE_REGISTRY:?TCRM_IMAGE_REGISTRY is required (deploy/.env)}/crm-postgres:${TCRM_VERSION:?TCRM_VERSION is required (deploy/.env)}
    # A real init as PID 1 is REQUIRED for archive-async: pgBackRest's background push process is
    # orphaned and re-parented to PID 1. When that is the postmaster, its non-zero exit (any archive
    # error, e.g. S3 unreachable) is taken for a crashed backend and restarts the whole server.
    init: true
    environment:
      POSTGRES_DB: ${TCRM_DB_NAME:-tcrm}
      # Superuser, used only for administration (initdb script, backups); crm-admin never gets it.
      POSTGRES_USER: ${TCRM_DB_SUPERUSER_USERNAME}
      POSTGRES_PASSWORD: ${TCRM_DB_SUPERUSER_PASSWORD}
      # Application account and its password; initdb/01-app-role.sh creates the account (not a
      # superuser) and makes it the owner of the database. Used on first start of an empty data volume only.
      TCRM_DB_USERNAME: ${TCRM_DB_USERNAME}
      TCRM_DB_PASSWORD: ${TCRM_DB_PASSWORD}
      TZ: UTC
      # pgBackRest (deploy/postgres/pgbackrest.conf holds the fixed settings, these are the environment
      # specific ones; ADR-037 decision 5). Access keys or an instance role: with an instance role set
      # PGBACKREST_REPO1_S3_KEY_TYPE=auto and leave PGBACKREST_REPO1_S3_KEY / _KEY_SECRET out of .env
      # (not even empty: an EMPTY PGBACKREST_* variable makes pgBackRest fail, hence the pass-through
      # form without a value, which passes nothing when the variable is not defined). The passphrase
      # and the bucket have no default: archiving fails loudly (pgbackrest check) when they are missing.
      PGBACKREST_PG1_USER: ${TCRM_DB_SUPERUSER_USERNAME}
      PGBACKREST_PG1_DATABASE: ${TCRM_DB_NAME:-tcrm}
      PGBACKREST_REPO1_TYPE: ${PGBACKREST_REPO1_TYPE:-s3}
      PGBACKREST_REPO1_PATH: ${PGBACKREST_REPO1_PATH:-/pgbackrest}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_REPO1_S3_REGION:-us-west-2}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:-s3.${PGBACKREST_REPO1_S3_REGION:-us-west-2}.amazonaws.com}
      PGBACKREST_REPO1_S3_KEY_TYPE: ${PGBACKREST_REPO1_S3_KEY_TYPE:-shared}
      PGBACKREST_REPO1_S3_KEY:
      PGBACKREST_REPO1_S3_KEY_SECRET:
    # PostgreSQL shared memory (parallel queries, dynamic shared memory); Docker's 64 MB default is too small.
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      # Slow query log threshold from the design document (100 ms).
      - -c
      - log_min_duration_statement=100
      # Continuous WAL archiving through pgBackRest (credentials come from the PGBACKREST_* environment,
      # never from this command line). archive_timeout bounds the data loss window to about 5 minutes.
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=pgbackrest --stanza=tcrm archive-push %p
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g

  redis:
    <<: [*restart, *logging]
    image: redis:7.4.5
    # Streams and the link index live here, so nothing may be evicted (noeviction); maxmemory leaves
    # headroom below the 1.5G container limit for fork/replication buffers. Authentication is mandatory.
    command:
      - sh
      - -c
      - >-
        [ -n "$$TCRM_REDIS_PASSWORD" ] || { echo "TCRM_REDIS_PASSWORD must be set" >&2; exit 1; };
        exec redis-server --appendonly yes --maxmemory 1280mb --maxmemory-policy noeviction
        --requirepass "$$TCRM_REDIS_PASSWORD"
    environment:
      TCRM_REDIS_PASSWORD: ${TCRM_REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$TCRM_REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m

# Fixed subnet so the proxy address range is stable. Nginx sets X-Forwarded-For / CF-Connecting-IP
# itself; applications that restrict trusted proxies should trust this subnet only.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

# Data volumes are created by hand once (docker volume create tcrm_pgdata tcrm_redisdata) and are
# external, so "docker compose down -v" cannot delete them (ADR-037; deploy/README.md).
volumes:
  pgdata:
    external: true
    name: tcrm_pgdata
  redisdata:
    external: true
    name: tcrm_redisdata
