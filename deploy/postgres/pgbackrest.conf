# pgBackRest settings baked into the image (ADR-037 decision 5). Everything environment specific is
# passed as PGBACKREST_* environment variables, which take precedence over this file; never write a
# key, a passphrase or a bucket name here.
#   PGBACKREST_REPO1_TYPE, PGBACKREST_REPO1_PATH, PGBACKREST_REPO1_S3_BUCKET, PGBACKREST_REPO1_S3_ENDPOINT,
#   PGBACKREST_REPO1_S3_REGION, PGBACKREST_REPO1_S3_KEY_TYPE (shared = access keys, auto = instance role),
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS

[global]
# Client-side encryption: S3 only ever sees ciphertext. The passphrase is PGBACKREST_REPO1_CIPHER_PASS.
repo1-cipher-type=aes-256-cbc
# Four full backups (weekly full => about four weeks); differentials and WAL of older fulls expire with them.
repo1-retention-full=4
# Asynchronous archiving keeps COMMIT fast and enables archive-push-queue-max.
archive-async=y
# When the repository is unreachable, WAL piles up in pg_wal. Beyond this size pgBackRest reports the
# segments as archived (and drops them) so the data disk never fills up. That leaves a gap in the
# archive: run a new full backup as soon as the repository is back (deploy/README.md, "Backup and restore").
archive-push-queue-max=4GiB
spool-path=/var/spool/pgbackrest
# Start the scheduled backup at once instead of waiting for the next checkpoint.
start-fast=y
log-path=/var/log/pgbackrest
log-level-console=warn
log-level-file=info

[global:archive-push]
# One log line per WAL segment would grow without rotation inside the container.
log-level-file=warn

[tcrm]
pg1-path=/var/lib/postgresql/data
