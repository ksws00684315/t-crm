# LOCAL PREVIEW ONLY. Not for any server.
# From the repository root:
#   deploy/scripts/preview.sh up
# Same services and image versions as docker-compose.prod.yml. Nginx is the only published port,
# bound to 127.0.0.1. PostgreSQL, Redis, crm-admin and crm-redirect stay on the compose network.
# Memory limits are smaller than production so a local Docker VM can run this next to other stacks.
# Redis still requires a password and uses noeviction.
name: tcrm-preview

x-restart: &restart
  restart: unless-stopped

services:
  nginx:
    <<: *restart
    image: nginx:1.30.5-alpine
    ports:
      - "127.0.0.1:8890:8890"
      - "127.0.0.1:8891:8891"
      - "127.0.0.1:8892:8892"
    volumes:
      # Static file, not the production templates: no certificates and no envsubst.
      - ./nginx/preview/preview.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./www-preview:/usr/share/nginx/sites:ro
    # service_started (not healthy): the redirect service must stay reachable even when the backend
    # is down, so Nginx only needs the upstream names to exist. Same as production.
    depends_on:
      crm-admin:
        condition: service_started
      crm-redirect:
        condition: service_started
    mem_limit: 128m

  crm-admin:
    <<: *restart
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      TCRM_ADMIN_PORT: "8080"
      TCRM_DB_HOST: postgres
      # Inside the compose network PostgreSQL always listens on 5432.
      TCRM_DB_PORT: "5432"
      TCRM_DB_NAME: ${TCRM_DB_NAME:-tcrm}
      TCRM_DB_USERNAME: ${TCRM_DB_USERNAME}
      TCRM_DB_PASSWORD: ${TCRM_DB_PASSWORD}
      TCRM_REDIS_HOST: redis
      TCRM_REDIS_PORT: "6379"
      TCRM_REDIS_PASSWORD: ${TCRM_REDIS_PASSWORD}
      TCRM_BOOTSTRAP_ADMIN_USERNAME: ${TCRM_BOOTSTRAP_ADMIN_USERNAME:-}
      TCRM_BOOTSTRAP_ADMIN_PASSWORD: ${TCRM_BOOTSTRAP_ADMIN_PASSWORD:-}
      TCRM_CORS_ALLOWED_ORIGINS: ${TCRM_CORS_ALLOWED_ORIGINS:-}
      # Placeholder https URLs. The backend rejects http; generated links are not browsable.
      TCRM_LINK_BASE_URL: ${TCRM_LINK_BASE_URL}
      TCRM_UPLOAD_BASE_URL: ${TCRM_UPLOAD_BASE_URL:-}
      TCRM_KOL_PORTAL_BASE_URL: ${TCRM_KOL_PORTAL_BASE_URL}
      TCRM_ADMIN_BASE_URL: ${TCRM_ADMIN_BASE_URL}
      TCRM_SECRET_KEY: ${TCRM_SECRET_KEY}
      TCRM_IP_HASH_SALT: ${TCRM_IP_HASH_SALT}
      # Empty: logging mail fallback, no real delivery.
      TCRM_MAIL_API_KEY: ${TCRM_MAIL_API_KEY:-}
      TCRM_MAIL_FROM: ${TCRM_MAIL_FROM:-}
      TCRM_CLICK_STREAM_MAXLEN: ${TCRM_CLICK_STREAM_MAXLEN:-1000000}
      # Fixed to the compose network subnet; not taken from .env (ADR-009).
      TCRM_TRUSTED_PROXIES: 172.30.0.0/24
      TCRM_CLIENT_IP_HEADERS: ${TCRM_CLIENT_IP_HEADERS:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # JRE image has no curl. CMD-SHELL uses /bin/sh (dash), which has no /dev/tcp;
      # invoke bash explicitly (Temurin JRE ships bash). Same probe as production.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1536m

  crm-redirect:
    <<: *restart
    build:
      context: ..
      dockerfile: redirect/Dockerfile
    environment:
      TCRM_REDIRECT_PORT: "8081"
      TCRM_REDIS_HOST: redis
      TCRM_REDIS_PORT: "6379"
      TCRM_REDIS_PASSWORD: ${TCRM_REDIS_PASSWORD}
      TCRM_REDIRECT_FALLBACK_URL: ${TCRM_REDIRECT_FALLBACK_URL}
      TCRM_IP_HASH_SALT: ${TCRM_IP_HASH_SALT}
      # Fixed to the compose network subnet; not taken from .env (ADR-009).
      TCRM_TRUSTED_PROXIES: 172.30.0.0/24
      TCRM_CLIENT_IP_HEADERS: ${TCRM_CLIENT_IP_HEADERS:-}
      TCRM_CLICK_STREAM_MAXLEN: ${TCRM_CLICK_STREAM_MAXLEN:-1000000}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Same as crm-admin: bash, not dash (see comment there).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200'"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m

  postgres:
    <<: *restart
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${TCRM_DB_NAME:-tcrm}
      POSTGRES_USER: ${TCRM_DB_USERNAME}
      POSTGRES_PASSWORD: ${TCRM_DB_PASSWORD}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      # Slow query log threshold from the design document (100 ms).
      - -c
      - log_min_duration_statement=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  redis:
    <<: *restart
    image: redis:7.4.5
    # noeviction: a full cache must fail the write, not drop sessions or the link index.
    # maxmemory stays under the container limit so fork/AOF overhead still fits.
    command:
      - sh
      - -c
      - >-
        [ -n "$$TCRM_REDIS_PASSWORD" ] || { echo "TCRM_REDIS_PASSWORD must be set" >&2; exit 1; };
        exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
        --requirepass "$$TCRM_REDIS_PASSWORD"
    environment:
      TCRM_REDIS_PASSWORD: ${TCRM_REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$TCRM_REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m

# Fixed subnet so TCRM_TRUSTED_PROXIES=172.30.0.0/24 matches the network, as in production.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  redisdata:
