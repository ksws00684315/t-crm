# 与生产模板 deploy/nginx/templates/default.conf.template 保持同步。
# 本地预览只走 HTTP，不使用证书，不引用 Cloudflare 回源 IP 段。三个站点按端口区分：
#   8890 管理端  8891 达人端  8892 跳转服务（仅 /t/、/i/、/healthz）
# location 与反向代理规则（含登录限流）照搬生产模板。生产模板若新增路径、限流或体积限制，
# 合并后须同步到本文件。任务 26 的推广表上传已同步（生产走 upload.<domain>，预览走管理端同源）；
# 17b 的 /admin-api/external/ 限流已与生产模板同步。

server_tokens off;

# Login endpoint rate limit (Cloudflare rules are the first line; this protects the origin).
limit_req_zone $binary_remote_addr zone=tcrm_login:10m rate=10r/m;
# Login captcha issuing (ADR-017); the backend also limits 120 per IP per minute.
limit_req_zone $binary_remote_addr zone=tcrm_captcha:10m rate=120r/m;
# External product-link APIs (task 17b / ADR-019); stacks with app Redis limits.
limit_req_zone $binary_remote_addr zone=tcrm_external:10m rate=120r/m;
# Redirect rate limit. Loose on purpose so shared mobile egress (CGNAT) is not blocked.
# Cloudflare rate limiting is the primary defense; this zone is the origin fallback.
limit_req_zone $binary_remote_addr zone=tcrm_redirect:10m rate=30r/s;

# ---- :8892 redirect service (only /t/..., /i/... and /healthz are exposed) ----
server {
    listen 8892;
    server_name _;
    include /etc/nginx/snippets/security-headers.conf;

    location /t/ {
        limit_req zone=tcrm_redirect burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://crm-redirect:8081;
    }

    # Links written by the customer's sheet script: /i/{copied Weidian item ID} (ADR-019).
    location /i/ {
        limit_req zone=tcrm_redirect burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://crm-redirect:8081;
    }

    location = /healthz {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://crm-redirect:8081;
        access_log off;
    }

    location / {
        return 404;
    }
}

# ---- :8891 creator portal ----
server {
    listen 8891;
    server_name _;
    include /etc/nginx/snippets/security-headers-web.conf;

    root /usr/share/nginx/sites/kol;
    client_max_body_size 20m;

    location /kol-api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://crm-admin:8080;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers-web.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- :8890 admin console ----
server {
    listen 8890;
    server_name _;
    include /etc/nginx/snippets/security-headers-web.conf;

    root /usr/share/nginx/sites/admin;
    # Imports accept files up to 20MB (spec 06); the extra 1MB covers multipart overhead.
    client_max_body_size 21m;

    # Promo-sheet upload (task 26). Production serves it on upload.<domain> (Cloudflare "DNS only");
    # Runtime system configuration selects the upload origin; empty uses this same origin.
    # Same limits as the production upload server.
    location ~ ^/admin-api/kol/kols/[0-9]+/promo-sheet-uploads$ {
        limit_except POST {
            deny all;
        }
        client_max_body_size 300m;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_pass http://crm-admin:8080;
    }

    location = /admin-api/auth/login {
        limit_req zone=tcrm_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://crm-admin:8080;
    }

    location = /admin-api/auth/captchas {
        limit_req zone=tcrm_captcha burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://crm-admin:8080;
    }

    location /admin-api/external/ {
        limit_req zone=tcrm_external burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://crm-admin:8080;
    }

    location /admin-api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://crm-admin:8080;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers-web.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
