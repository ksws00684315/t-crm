# Cloudflare origin certificate (Full (strict) mode) for the proxied sites t. and kol.<domain>;
# mount it under TCRM_CERT_DIR. Browsers do NOT trust this certificate: never use it on a grey-cloud
# host (upload.<domain>), use tls-public.conf there.
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
include /etc/nginx/snippets/tls-common.conf;
