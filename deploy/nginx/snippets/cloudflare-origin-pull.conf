# Authenticated Origin Pulls (ADR-037 decision 4): only requests that present the Cloudflare client
# certificate are served. Included by t., kol. and admin.<domain> only; upload.<domain> is grey cloud
# (not proxied), so it must not include this file. If admin.<domain> is ever switched to grey cloud,
# remove the include from its server block (deploy/README.md).
ssl_client_certificate /etc/nginx/snippets/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
