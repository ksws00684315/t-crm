# Spec 06 section 3: nosniff, Referrer-Policy, HSTS (also enabled at Cloudflare if preferred).
# add_header is not inherited into a block that defines its own add_header, so every such block
# includes this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
