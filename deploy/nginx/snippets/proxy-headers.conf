# Upstream protocol and forwarding headers, without timeouts. The client address is whatever the
# real-IP module resolved ($remote_addr after set_real_ip_from for Cloudflare); client-supplied
# forwarding headers are overwritten, never appended to, so they cannot be spoofed towards the
# applications. Locations that need their own timeouts (the promo-sheet upload) include only this.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header CF-Connecting-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
