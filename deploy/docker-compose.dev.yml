# Shared local PostgreSQL and Redis for preview, native development and task worktrees.
# Start with: deploy/scripts/local-infra.sh up
name: ${TCRM_LOCAL_INFRA_PROJECT:-tcrm-local}

services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TCRM_DB_NAME:-tcrm}
      POSTGRES_USER: ${TCRM_DB_USERNAME}
      POSTGRES_PASSWORD: ${TCRM_DB_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${TCRM_LOCAL_INFRA_DB_PORT:-${TCRM_DB_PORT:-55432}}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - tcrm-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.5
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        [ -n "$$TCRM_REDIS_PASSWORD" ] || { echo "TCRM_REDIS_PASSWORD must be set" >&2; exit 1; };
        exec redis-server --appendonly yes --requirepass "$$TCRM_REDIS_PASSWORD"
    environment:
      TCRM_REDIS_PASSWORD: ${TCRM_REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${TCRM_LOCAL_INFRA_REDIS_PORT:-${TCRM_REDIS_PORT:-46391}}:6379"
    volumes:
      - redisdata:/data
    networks:
      default:
        aliases:
          - tcrm-redis
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$TCRM_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  default:
    name: ${TCRM_LOCAL_INFRA_NETWORK:-tcrm-local}

volumes:
  pgdata:
    name: ${TCRM_LOCAL_INFRA_PROJECT:-tcrm-local}_pgdata
  redisdata:
    name: ${TCRM_LOCAL_INFRA_PROJECT:-tcrm-local}_redisdata
