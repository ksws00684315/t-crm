# Local dependencies for development: PostgreSQL 17 and Redis 7.
#   cp deploy/.env.example deploy/.env      # fill in TCRM_DB_USERNAME / TCRM_DB_PASSWORD
#   docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env up -d
# Tables are created by Flyway when the backend starts; there is no init SQL here.
# Host ports come from TCRM_DB_PORT / TCRM_REDIS_PORT (default 5432 / 6379) and are bound to
# localhost only. Change them in deploy/.env when the defaults are already in use.
name: tcrm-dev

services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TCRM_DB_NAME:-tcrm}
      POSTGRES_USER: ${TCRM_DB_USERNAME}
      POSTGRES_PASSWORD: ${TCRM_DB_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${TCRM_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.5
    restart: unless-stopped
    # The password (optional in dev) is read inside the container, so it never appears in the
    # process arguments of the compose file or in `docker inspect` output of the command.
    command: ["sh", "-c", "exec redis-server --appendonly yes $${TCRM_REDIS_PASSWORD:+--requirepass \"$$TCRM_REDIS_PASSWORD\"}"]
    environment:
      TCRM_REDIS_PASSWORD: ${TCRM_REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${TCRM_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$TCRM_REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$TCRM_REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
