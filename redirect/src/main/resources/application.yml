server:
  port: ${TCRM_REDIRECT_PORT:8081}
spring:
  application:
    name: crm-redirect
  data:
    redis:
      host: ${TCRM_REDIS_HOST:localhost}
      port: ${TCRM_REDIS_PORT:6379}
      password: ${TCRM_REDIS_PASSWORD:}
      database: 0
      connect-timeout: 1s
      timeout: 1s
crm:
  redirect:
    fallback-url: ${TCRM_REDIRECT_FALLBACK_URL}
    ip-hash-salt: ${TCRM_IP_HASH_SALT}
    # Approximate XADD MAXLEN for stream:click; the oldest clicks are dropped beyond it.
    click-stream-max-len: ${TCRM_CLICK_STREAM_MAXLEN:1000000}
  http:
    # Forwarding headers are honoured only when the direct peer matches trusted-proxies (CIDR list).
    trusted-proxies: ${TCRM_TRUSTED_PROXIES:}
    client-ip-headers: ${TCRM_CLIENT_IP_HEADERS:CF-Connecting-IP,X-Forwarded-For}
