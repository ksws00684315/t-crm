server:
  port: ${TCRM_ADMIN_PORT:8080}
spring:
  application:
    name: crm-admin
  datasource:
    url: jdbc:postgresql://${TCRM_DB_HOST:localhost}:${TCRM_DB_PORT:5432}/${TCRM_DB_NAME:tcrm}
    username: ${TCRM_DB_USERNAME}
    password: ${TCRM_DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: ${TCRM_REDIS_HOST:localhost}
      port: ${TCRM_REDIS_PORT:6379}
      password: ${TCRM_REDIS_PASSWORD:}
      database: 0
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Import files are limited to 20 MB (spec 06 section 3); the request adds form overhead.
      max-file-size: 20MB
      max-request-size: 21MB
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 200
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
sa-token:
  token-name: X-Admin-Token
  timeout: 28800
  is-read-cookie: false
  is-read-body: false
  is-read-header: true
  is-log: false
crm:
  bootstrap:
    username: ${TCRM_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${TCRM_BOOTSTRAP_ADMIN_PASSWORD:}

  cors:
    allowed-origins: ${TCRM_CORS_ALLOWED_ORIGINS:}
  http:
    # Forwarding headers are honoured only when the direct peer matches trusted-proxies (CIDR list).
    trusted-proxies: ${TCRM_TRUSTED_PROXIES:}
    client-ip-headers: ${TCRM_CLIENT_IP_HEADERS:CF-Connecting-IP,X-Forwarded-For}
