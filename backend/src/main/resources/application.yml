server:
  port: ${TCRM_ADMIN_PORT:8080}
spring:
  application:
    name: crm-admin
  datasource:
    url: jdbc:postgresql://${TCRM_DB_HOST:localhost}:${TCRM_DB_PORT:5432}/${TCRM_DB_NAME:tcrm}
    username: ${TCRM_DB_USERNAME}
    password: ${TCRM_DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: ${TCRM_REDIS_HOST:localhost}
      port: ${TCRM_REDIS_PORT:6379}
      password: ${TCRM_REDIS_PASSWORD:}
      database: 0
  flyway:
    locations: classpath:db/migration
  messages:
    # User-facing texts follow the request language (ADR-0.15); an unsupported locale never falls
    # back to the server default but to the base bundle, which equals the English one.
    fallback-to-system-locale: false
    encoding: UTF-8
  servlet:
    multipart:
      # Import files are limited to 20 MB (spec 06 section 3); the request adds form overhead.
      max-file-size: 20MB
      max-request-size: 21MB
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 200
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
sa-token:
  token-name: X-Admin-Token
  # Absolute administrator token lifetime 8 h; a token unused for 2 h also expires (OWASP ASVS L2
  # session inactivity timeout). Administrator namespace only: the KOL namespace overrides these
  # values with its own config (crm.kol-auth.*, design document §3.3).
  timeout: 28800
  active-timeout: 7200
  is-read-cookie: false
  is-read-body: false
  is-read-header: true
  is-log: false
crm:
  auth:
    captcha:
      # Image captcha on every administrator login (ADR-017). Never disable in production; false
      # is only for local development and logs a WARN at startup when set.
      enabled: true
      # Captchas one client IP may request per minute (owner decision on PR #35); 429 above it.
      issue-per-minute: 120
  # Independent KOL token namespace (task 12a §4.2, design §3.3): read only from the X-Kol-Token
  # header, 7-day absolute lifetime, 3-day idle timeout, at most 10 tokens per KOL. The KOL portal
  # login has no image captcha (owner decision 2026-10-16; protection comes from ADR-008 locking
  # and Nginx rate limiting).
  kol-auth:
    token-name: X-Kol-Token
    timeout: 604800
    active-timeout: 259200
    max-login-count: 10
  # Mail transport (task 12a §4.5, design §7.3): Resend when an API key is configured, otherwise a
  # logging fallback for local development. A key without a sender address aborts startup.
  mail:
    api-key: ${TCRM_MAIL_API_KEY:}
    from: ${TCRM_MAIL_FROM:}
    # Logs invitation/reset links and registration codes so a local developer can use them. Those
    # values set or prove a KOL password: NEVER enable in production. Off, the mail log has neither
    # the recipient nor the body.
    log-links: false
  # Public base of the KOL portal: https, no trailing slash (prod: https://kol.<domain>). Required;
  # startup fails when it is missing or malformed. Invitation and reset links point here.
  kol-portal:
    base-url: ${TCRM_KOL_PORTAL_BASE_URL}
  bootstrap:
    username: ${TCRM_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${TCRM_BOOTSTRAP_ADMIN_PASSWORD:}

  link:
    # Public base of the tracking links: https, no trailing slash (prod: https://t.<domain>). Required;
    # startup fails when it is missing or malformed.
    base-url: ${TCRM_LINK_BASE_URL}
    # Same value as the redirect service's XADD MAXLEN; the click backlog alarm uses 50% / 80% of it.
    click-stream-max-len: ${TCRM_CLICK_STREAM_MAXLEN:1000000}
  cors:
    allowed-origins: ${TCRM_CORS_ALLOWED_ORIGINS:}
  weidian:
    secret-key: ${TCRM_SECRET_KEY:}
    admin-base-url: ${TCRM_ADMIN_BASE_URL:}
    api-base-url: https://api.vdian.com/api
    oauth-base-url: https://oauth.open.weidian.com
    qps: 5
  fx:
    # ECB daily reference rates (design §7.5); public, no key. Tests point it at a local stub.
    ecb-url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
  http:
    # Forwarding headers are honoured only when the direct peer matches trusted-proxies (CIDR list).
    trusted-proxies: ${TCRM_TRUSTED_PROXIES:}
    client-ip-headers: ${TCRM_CLIENT_IP_HEADERS:CF-Connecting-IP,X-Forwarded-For}
