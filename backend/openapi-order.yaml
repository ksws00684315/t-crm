openapi: 3.0.3
info:
  title: T-CRM order API
  version: 1.2.0
  description: >-
    Task 13 static contract; task 18 added the order and refund Excel imports; task 19a added the
    display names and the shop sync-state endpoint; task 70 (1024 handoff B01-B04) added the
    order-time range, kol keyword, refund-state and abnormal filters. Company comes from the login
    session; OWN scope uses the order's payment-time BD snapshot. No buyer data is returned.
    接口以设计说明书 §6.2 / §6.3 为准，由 ApiCatalogConsistencyTest 保证与代码一致；Existing springdoc integration is deferred (engineering gap I6).
security:
  - AdminToken: []
paths:
  /kol-api/orders:
    get:
      operationId: listMyOrders
      summary: List the authenticated KOL's attributed orders
      description: >-
        Read-only. Orders must have kol_id equal to the authenticated KOL and attribution_status
        ATTRIBUTED. payFrom is inclusive and payTo exclusive in UTC. The order number is masked.
        Response contains only this KOL's item amounts and never contains internal IDs, buyer data,
        shop, BD, attribution details, manual reasons, or product IDs.
      security:
        - KolToken: []
      x-authentication: KOL login
      parameters:
        - {$ref: '#/components/parameters/payFrom'}
        - {$ref: '#/components/parameters/payTo'}
        - name: orderStatus
          in: query
          schema: {$ref: '#/components/schemas/OrderStatus'}
        - {$ref: '#/components/parameters/page'}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Current KOL's attributed orders, newest payment time first.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: {type: array, items: {$ref: '#/components/schemas/KolOrder'}}
                          total: {type: string, pattern: '^[0-9]+$'}
                          page: {type: integer}
                          size: {type: integer, maximum: 50}
              example:
                code: 0
                msg: Success
                data:
                  items:
                    - orderNo: '2026****1234'
                      payTime: '2026-10-16T08:00:00Z'
                      orderStatus: PAID
                      payAmount: '128.00'
                      refundAmount: '8.00'
                      items:
                        - {itemName: 'Sample item', skuName: 'Blue / M', quantity: 2, payAmount: '128.00', refundAmount: '8.00'}
                  total: '1'
                  page: 1
                  size: 20
                errorCode: null
                traceId: example-trace
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin-api/order/orders:
    get:
      operationId: listOrders
      summary: Query orders, items and completed refund totals
      description: >-
        Task 70 (B01-B04) filters: orderTimeFrom/orderTimeTo bound crm_order.order_time (the
        platform order time, never pay_time or the sync create_time), from inclusive and to
        exclusive, both combinable with payFrom/payTo. kolKeyword matches a creator's code
        (case-insensitive exact), name (case-insensitive contains, % and _ escaped) or email
        (case-insensitive exact) — the same rule as the creator-item kolKeyword — and is
        resolved through kol.api to the main-order kol; no match yields an empty page.
        refundState is an EXISTS filter over crm_refund rows: REFUNDING means a PROCESSING row
        exists, REFUNDED means a SUCCESS row exists (partial or whole); multiple refund rows of one
        order never duplicate it and one order can match both values. abnormal=true selects the
        union orderStatus=UNKNOWN OR attributionStatus IN (UNMATCHED, CONFLICT), intersected with
        the other filters. Refund states are separate from the orderStatus enum.
      x-permission: order:view
      parameters:
        - {$ref: '#/components/parameters/shopId'}
        - {$ref: '#/components/parameters/payFrom'}
        - {$ref: '#/components/parameters/payTo'}
        - {$ref: '#/components/parameters/orderTimeFrom'}
        - {$ref: '#/components/parameters/orderTimeTo'}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - name: kolCode
          in: query
          schema: {type: string, maxLength: 16}
          example: KOL0100
        - name: kolKeyword
          in: query
          schema: {type: string, maxLength: 128}
          example: Zoe
        - name: orderStatus
          in: query
          schema: {$ref: '#/components/schemas/OrderStatus'}
        - name: attributionStatus
          in: query
          schema: {$ref: '#/components/schemas/AttributionStatus'}
        - name: refundState
          in: query
          schema: {type: string, enum: [REFUNDING, REFUNDED]}
        - name: abnormal
          in: query
          description: true selects the abnormal union; false or absent applies no condition.
          schema: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/Orders'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin-api/order/unmatched:
    get:
      operationId: listUnmatchedOrders
      summary: Query CONFLICT and UNMATCHED orders with items
      description: >-
        Accepts the same query fields as listOrders (including the task 70 order-time, kolKeyword,
        refundState and abnormal filters); the pool condition always applies.
      x-permission: order:manage
      parameters:
        - {$ref: '#/components/parameters/shopId'}
        - {$ref: '#/components/parameters/payFrom'}
        - {$ref: '#/components/parameters/payTo'}
        - {$ref: '#/components/parameters/orderTimeFrom'}
        - {$ref: '#/components/parameters/orderTimeTo'}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: kolCode, in: query, schema: {type: string, maxLength: 16}}
        - {name: kolKeyword, in: query, schema: {type: string, maxLength: 128}}
        - {name: orderStatus, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {name: attributionStatus, in: query, schema: {$ref: '#/components/schemas/AttributionStatus'}}
        - {name: refundState, in: query, schema: {type: string, enum: [REFUNDING, REFUNDED]}}
        - {name: abnormal, in: query, schema: {type: boolean}}
      responses:
        '200': {$ref: '#/components/responses/Orders'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin-api/order/sync-states:
    get:
      operationId: listOrderSyncStates
      summary: List every shop of the company with its order-sync status
      description: >-
        Shops without a sync record still appear; lastSuccessAt and lastError are then null.
        The order pages use this endpoint as the shop filter so accounts without product:view
        can still pick a shop.
      x-permission: order:view
      responses:
        '200':
          description: Shop sync states in the current company.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/OrderSyncState'}}
              example:
                code: 0
                msg: Success
                data:
                  - {shopId: '10', shopName: Main shop, enabled: true, authorized: true, lastSuccessAt: '2026-10-16T00:00:00Z', lastError: null}
                  - {shopId: '20', shopName: Backup shop, enabled: false, authorized: false, lastSuccessAt: null, lastError: null}
                errorCode: null
                traceId: example-trace
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin-api/order/syncs:
    post:
      operationId: synchronizeOrders
      summary: Start background synchronization after acquiring the shop lock
      x-permission: order:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId]
              properties:
                shopId: {$ref: '#/components/schemas/Id'}
            example: {shopId: '10'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'SHOP_NOT_FOUND: shop is absent or belongs to another company'}
        '409': {description: 'ORDER_SYNC_RUNNING: shop synchronization is already running'}
        '422': {description: 'SHOP_DISABLED or WEIDIAN_SHOP_NOT_AUTHORIZED'}
  /admin-api/order/orders/{id}/attribution:
    put:
      operationId: assignOrderAttribution
      summary: Assign the whole order to a company KOL or mark it non-KOL
      description: Requires a paid order and a reason; records an audit entry and the BD snapshot.
      x-permission: order:manage
      parameters:
        - {$ref: '#/components/parameters/id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                kolId: {$ref: '#/components/schemas/Id'}
                nonKol: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 255, pattern: '\S'}
              oneOf:
                - required: [kolId]
                  properties:
                    nonKol: {type: boolean, enum: [false]}
                - required: [nonKol]
                  properties:
                    nonKol: {type: boolean, enum: [true]}
                  not: {required: [kolId]}
            examples:
              kol: {value: {kolId: '100', reason: 'Operator confirmed the creator'}}
              nonKol: {value: {nonKol: true, reason: 'Direct store sale'}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'COMMON_NOT_FOUND: order or KOL is absent or belongs to another company'}
        '409': {description: 'COMMON_CONFLICT: unpaid order'}
  /admin-api/order/orders/{id}/reattribution:
    post:
      operationId: reattributeOrder
      summary: Clear old decisions and automatically attribute using payment-time mappings
      x-permission: order:manage
      parameters:
        - {$ref: '#/components/parameters/id'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'COMMON_NOT_FOUND: order is absent or belongs to another company'}
  /admin-api/order/order-imports/template:
    get:
      operationId: downloadOrderImportTemplate
      summary: Download the order import workbook template
      x-permission: order:manage
      responses:
        '200':
          description: XLSX template whose header row follows Accept-Language
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin-api/order/order-imports:
    post:
      operationId: submitOrderImport
      summary: Queue an order Excel import; progress via /admin-api/task/tasks/{id}
      x-permission: order:manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '202': {$ref: '#/components/responses/ImportAccepted'}
        '400': {description: 'TASK_FILE_*: invalid workbook, header, size or row count'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: 'TASK_QUEUE_FULL'}
  /admin-api/order/refund-imports/template:
    get:
      operationId: downloadRefundImportTemplate
      summary: Download the refund import workbook template
      x-permission: order:manage
      responses:
        '200':
          description: XLSX template whose header row follows Accept-Language
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin-api/order/refund-imports:
    post:
      operationId: submitRefundImport
      summary: Queue a refund Excel import; progress via /admin-api/task/tasks/{id}
      x-permission: order:manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '202': {$ref: '#/components/responses/ImportAccepted'}
        '400': {description: 'TASK_FILE_*: invalid workbook, header, size or row count'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: 'TASK_QUEUE_FULL'}
components:
  securitySchemes:
    AdminToken: {type: apiKey, in: header, name: X-Admin-Token}
    KolToken: {type: apiKey, in: header, name: X-Kol-Token}
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
      example: '2110000000000000001'
    shopId: {name: shopId, in: query, schema: {$ref: '#/components/schemas/Id'}, example: '10'}
    payFrom:
      name: payFrom
      in: query
      description: Inclusive UTC ISO 8601 instant; must precede payTo.
      schema: {type: string, format: date-time}
      example: '2026-10-16T00:00:00Z'
    payTo:
      name: payTo
      in: query
      description: Exclusive UTC ISO 8601 instant.
      schema: {type: string, format: date-time}
      example: '2026-10-17T00:00:00Z'
    orderTimeFrom:
      name: orderTimeFrom
      in: query
      description: >-
        Inclusive UTC ISO 8601 instant bounding crm_order.order_time (the platform order time);
        must precede orderTimeTo. Independent of payFrom/payTo.
      schema: {type: string, format: date-time}
      example: '2026-10-16T00:00:00Z'
    orderTimeTo:
      name: orderTimeTo
      in: query
      description: Exclusive UTC ISO 8601 instant bounding crm_order.order_time.
      schema: {type: string, format: date-time}
      example: '2026-10-17T00:00:00Z'
    page: {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
    size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  schemas:
    Id: {type: string, pattern: '^[1-9][0-9]*$', example: '2110000000000000001'}
    Money: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', example: '12.50', description: CNY yuan}
    OrderStatus: {type: string, enum: [UNPAID, PAID, SHIPPED, RECEIVED, COMPLETED, CLOSED, UNKNOWN]}
    KolOrder:
      type: object
      required: [orderNo, payTime, orderStatus, payAmount, refundAmount, items]
      properties:
        orderNo:
          type: string
          description: More than 8 characters keeps the first and last 4 characters; otherwise only the last 2 remain.
          example: '2026****1234'
        payTime: {type: string, format: date-time}
        orderStatus: {$ref: '#/components/schemas/OrderStatus'}
        payAmount: {$ref: '#/components/schemas/Money'}
        refundAmount: {$ref: '#/components/schemas/Money'}
        items: {type: array, items: {$ref: '#/components/schemas/KolOrderItem'}}
    KolOrderItem:
      type: object
      required: [itemName, skuName, quantity, payAmount, refundAmount]
      properties:
        itemName: {type: string}
        skuName: {type: string}
        quantity: {type: integer, minimum: 1}
        payAmount: {$ref: '#/components/schemas/Money'}
        refundAmount: {$ref: '#/components/schemas/Money'}
    AttributionStatus: {type: string, enum: [PENDING, ATTRIBUTED, NON_KOL, CONFLICT, UNMATCHED]}
    Envelope:
      type: object
      properties:
        code: {type: integer, example: 0}
        msg: {type: string, example: Success}
        data: {nullable: true}
        errorCode: {type: string, nullable: true}
        traceId: {type: string, nullable: true}
    Order:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Id'}
        shopId: {$ref: '#/components/schemas/Id'}
        shopName: {type: string, nullable: true, description: Display name; null when the shop was deleted.}
        weidianOrderId: {type: string}
        kolId: {type: string, nullable: true}
        kolCode: {type: string, nullable: true, description: Present when the order has a KOL.}
        kolName: {type: string, nullable: true}
        bdUserId: {type: string, nullable: true}
        bdUserName: {type: string, nullable: true, description: Nickname first then username; null assigns the order to the company.}
        orderStatus: {$ref: '#/components/schemas/OrderStatus'}
        attributionStatus: {$ref: '#/components/schemas/AttributionStatus'}
        orderTime: {type: string, format: date-time}
        payTime: {type: string, format: date-time, nullable: true}
        totalAmount: {$ref: '#/components/schemas/Money'}
        payAmount: {$ref: '#/components/schemas/Money'}
        refundAmount: {$ref: '#/components/schemas/Money'}
        items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
    OrderItem:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Id'}
        subOrderId: {type: string}
        weidianItemId: {type: string}
        skuId: {type: string}
        itemName: {type: string}
        skuName: {type: string}
        quantity: {type: integer, minimum: 1}
        payAmount: {$ref: '#/components/schemas/Money'}
        refundAmount: {$ref: '#/components/schemas/Money'}
        kolId: {type: string, nullable: true}
        kolCode: {type: string, nullable: true}
        productId: {type: string, nullable: true}
        kolItemId: {type: string, nullable: true}
        attributionType: {type: integer, enum: [0, 1, 2, 3, 4]}
        manualReason: {type: string, nullable: true}
    OrderSyncState:
      type: object
      properties:
        shopId: {$ref: '#/components/schemas/Id'}
        shopName: {type: string}
        enabled: {type: boolean}
        authorized: {type: boolean}
        lastSuccessAt: {type: string, format: date-time, nullable: true}
        lastError: {type: string, nullable: true, description: Safe English summary, at most 500 characters.}
  responses:
    Ok:
      description: Successful operation; data is null.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
          example: {code: 0, msg: Success, data: null, errorCode: null, traceId: example-trace}
    Accepted:
      description: Shop lock acquired; synchronization continues in the background.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
          example: {code: 0, msg: Success, data: null, errorCode: null, traceId: example-trace}
    ImportAccepted:
      description: Import task queued; poll /admin-api/task/tasks/{taskId}.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - type: object
                properties:
                  data:
                    type: object
                    required: [taskId]
                    properties:
                      taskId: {$ref: '#/components/schemas/Id'}
          example: {code: 0, msg: Success, data: {taskId: '2110000000000000001'}, errorCode: null, traceId: example-trace}
    Orders:
      description: Orders in the current company and allowed BD scope.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Order'}}
                      total: {type: string, pattern: '^[0-9]+$', example: '0'}
                      page: {type: integer}
                      size: {type: integer}
          example: {code: 0, msg: Success, data: {items: [], total: '0', page: 1, size: 20}, errorCode: null, traceId: example-trace}
    Invalid: {description: 'COMMON_VALIDATION_FAILED: invalid query, path, target or blank/oversized reason'}
    Unauthorized: {description: 'AUTH_UNAUTHORIZED or AUTH_ACCOUNT_DISABLED: invalid administrator session'}
    Forbidden: {description: 'AUTH_FORBIDDEN: missing permission, platform account, or order outside OWN scope'}
